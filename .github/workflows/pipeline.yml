name: Pipeline

# Pulls Statcast and the umpire assignments, retrains the called-strike model,
# regrades every catcher, commits the results back, and (on main) publishes the
# page to treychase.github.io.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"          # Mondays 11:17 UTC, after the weekend's games
  push:
    branches: [main, "claude/**"]
    paths:
      - "framing/**"
      - "pyproject.toml"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Restore the Statcast cache
        uses: actions/cache@v4
        with:
          path: data
          key: statcast-${{ github.run_id }}
          restore-keys: statcast-

      - name: Fetch Statcast and umpires
        run: python -m framing fetch

      - name: Model, grade, validate, build the page
        run: python -m framing run

      - uses: actions/upload-artifact@v4
        with:
          name: framing-results
          path: |
            results/
            site/

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results site
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild framing results ($(date -u +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish to treychase.github.io
        # Needs a fine-grained token on the site repo with Contents: read and write,
        # saved as the SITE_DEPLOY_TOKEN secret. Skipped until it exists, and never
        # from a feature branch.
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "SITE_DEPLOY_TOKEN not set; skipping publish"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/treychase/treychase.github.io.git" site-repo
          cp site/catcher-framing.html site-repo/projects/catcher-framing.html
          cd site-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add projects/catcher-framing.html
          if git diff --cached --quiet; then echo "Site already current"; exit 0; fi
          git commit -m "Update the catcher framing page ($(date -u +%F))"
          git push origin HEAD:main
