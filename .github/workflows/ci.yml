name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest --cov=framing --cov-report=term-missing
      - name: Smoke test the full pipeline on synthetic data
        if: matrix.python == '3.12'
        run: python -m framing run --synthetic --quick --out smoke/results --site smoke/catcher-framing.html
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: synthetic-smoke-page
          path: smoke/
          retention-days: 7
